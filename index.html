<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Animation</title>
  <style>
    /* Intègre le CSS fourni plus haut ici */
  </style>
</head>
<body>

  <!-- PAGE ACCUEIL / HUB -->
  <main class="hub-container">
    
    <!-- Module 1 : Fiche Sanitaire -->
    <div class="hub-card" style="background-color: var(--sanitaire-bg); color: var(--sanitaire-text);">
      <h3>Fiches Sanitaires</h3>
      <!-- Contenu module -->
    </div>

    <!-- Module 2 : Santé / Blessures -->
    <div class="hub-card" style="background-color: var(--sante-bg); color: var(--sante-text);">
      <h3>Santé & Blessures</h3>
      <!-- Contenu module -->
    </div>

    <!-- Module 3 : Fiches d'Activités -->
    <div class="hub-card" style="background-color: var(--activite-bg); color: var(--activite-text);">
      <h3>Fiches d'Activités</h3>
      <!-- Pastille express retirée ici -->
    </div>

    <!-- Module 4 : Goûter / Manger -->
    <div class="hub-card" style="background-color: var(--gouter-bg); color: var(--gouter-text);">
      <h3>Goûters & Recettes</h3>
      <!-- Contenu module -->
    </div>

    <!-- Module 5 : Liste de Courses -->
    <div class="hub-card" style="background-color: var(--courses-bg); color: var(--courses-text);">
      <h3>Liste de Courses</h3>
      <!-- Contenu module -->
    </div>

    <!-- Module 6 : Planning d'Équipe -->
    <div class="hub-card" style="background-color: var(--planning-bg); color: var(--planning-text);">
      <h3>Planning d'Équipe</h3>
      <!-- Contenu module -->
    </div>

  </main>

  <!-- Exemple Modal / Popup corrigé -->
  <div class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Titre du Popup</h2>
      <p>Contenu du popup bien centré avec le fond totalement assombri.</p>
    </div>
  </div>

</body>
</html>

<style>

body{--c:#94a3b8;--bg:#f1f5f9;font-family:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Nunito','Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));transition:background .5s;user-select:none;-webkit-user-select:none}

body[data-state=red]{--c:#f43f5e;--bg:#fff1f2}

.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.h{display:flex;align-items:center;gap:8px}.h .ic{color:var(--blue);width:1.3em;height:1.3em}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:44px;height:44px;border-radius:13px;flex:none;box-shadow:0 6px 14px -6px rgba(37,99,235,.7)}
h1{font-size:23px!important;font-weight:900!important}

#timer{display:inline-flex;align-items:center;gap:5px}

@keyframes loud{0%,100%{transform:rotate(0) scale(1.05)}25%{transform:rotate(-10deg) scale(1.12)}75%{transform:rotate(10deg) scale(1.12)}}
@keyframes flash{0%,100%{background:#ffe4e6}50%{background:#fda4af}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}100%{box-shadow:0 0 0 9px rgba(16,185,129,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const $ = id => document.getElementById(id);
const ico = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const NAMES = ['Carillon', 'Bip', 'Buzzer', 'Klaxon', 'Sirène'];
NAMES.forEach((n, i) => {
  $('steps').insertAdjacentHTML('beforeend', `<div class="step" id="step-${i + 1}"><b>${i + 1}</b><span>${n}</span></div>`);
  $('tests').insertAdjacentHTML('beforeend', `<button type="button" onclick="alarm(${i + 1})"><b>${i + 1}</b><span>${n}</span></button>`);
});

let ctx, comp, master, analyser, micStream;
let listening = false, raf = null, wakeLock = null, sessionMode = 'play-and-record', paused = false;
let threshold = 65, gainMul = 4.5, delayMs = 1500, cooldownMs = 4000;
let level = 0, shown = 0, overSince = null, lastAlert = 0, smooth = 0, siren = false, sirenT = null;

function banner(msg, type = 'error') {
  $('banner').className = msg ? 'show ' + type : '';
  if (msg) $('banner-text').textContent = msg;
}
function applySession() { if (sessionMode !== 'auto') setSession(sessionMode); }
function setSession(t) { try { if (navigator.audioSession) navigator.audioSession.type = t; } catch (e) {} }

async function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = ctx.createGain(); master.gain.value = 1.35;
    comp.connect(master);
    master.connect(ctx.destination);
  }
  if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 600))]);
}
['touchstart', 'click'].forEach(e => document.addEventListener(e, () => {
  if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
}, { passive: true }));

async function playAlarm(n) {
  try {
    await ensureAudio();
    if (listening && !paused) applySession();
    const t = ctx.currentTime;
    const tone = (type, f, t0, dur, peak, atk) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.001, t0); g.gain.linearRampToValueAtTime(peak, t0 + atk); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(comp); o.start(t0); o.stop(t0 + dur + 0.02);
    };
    if (n === 1) { tone('sine', 659.25, t, .48, .85, .025); tone('triangle', 523.25, t + .24, .68, .85, .025); }
    else if (n === 2) { [0, .21].forEach(o => tone('triangle', 1100, t + o, .15, .95, .012)); }
    else if (n === 3) { [0, .23, .46].forEach(o => { tone('sawtooth', 560, t + o, .18, .8, .015); tone('square', 598, t + o, .18, .8, .015); }); }
    else if (n === 4) { for (let i = 0; i < 5; i++) { tone('sawtooth', 330, t + i * .15, .125, .9, .01); tone('square', 485, t + i * .15, .125, .9, .01); } }
    else {
      const dur = 4, o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o1.type = 'sawtooth'; o2.type = 'square';
      for (let c = 0; c < 4; c++) {
        const t0 = t + c, tp = t0 + .55, te = t0 + 1;
        o1.frequency.setValueAtTime(460, t0); o1.frequency.linearRampToValueAtTime(1220, tp); o1.frequency.linearRampToValueAtTime(460, te);
        o2.frequency.setValueAtTime(230, t0); o2.frequency.linearRampToValueAtTime(610, tp); o2.frequency.linearRampToValueAtTime(230, te);
      }
      g.gain.setValueAtTime(0.01, t); g.gain.linearRampToValueAtTime(.95, t + .08); g.gain.setValueAtTime(.95, t + dur - .25); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o1.connect(g); o2.connect(g); g.connect(comp);
      o1.start(t); o2.start(t); o1.stop(t + dur + .02); o2.stop(t + dur + .02);
      sirenMode(dur * 1000);
    }
  } catch (e) { console.error(e); }
}

const wait = ms => new Promise(r => setTimeout(r, ms));
const DUR = { 1: .95, 2: .4, 3: .7, 4: .8, 5: 4.1 };
function closeMicOnly() {
  cancelAnimationFrame(raf);
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  analyser = null;
}
async function openMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }, video: false });
  analyser = ctx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .25;
  ctx.createMediaStreamSource(micStream).connect(analyser);
}
async function ensureRunning() {
  for (let i = 0; i < 4 && ctx.state !== 'running'; i++) {
    try { await Promise.race([ctx.resume(), wait(400)]); } catch (e) {}
  }
  return ctx.state === 'running';
}
async function rebuildCtx() {          // contexte audio bloqué par iOS : on en recrée un propre
  try { ctx.close(); } catch (e) {}
  ctx = null; await ensureAudio(); await ensureRunning();
}
// Pendant l'alarme, le micro est libéré : iOS rend alors la sortie à l'enceinte Bluetooth
async function alarm(n) {
  if (!listening) return playAlarm(n);
  if (paused) return;
  paused = true;
  const tm = $('timer');
  try {
    closeMicOnly(); setSession('playback');
    tm.className = 'show'; tm.innerHTML = ico('volume') + 'Alarme en cours';
    await wait(700);
    if (!(await ensureRunning())) await rebuildCtx();
    await playAlarm(n);
    await wait(DUR[n] * 1000 + 350);
    if (!listening) return;
    applySession();
    if (!(await ensureRunning())) await rebuildCtx();
    await openMic();
    if (!(await ensureRunning())) { await rebuildCtx(); closeMicOnly(); await openMic(); }
    smooth = 0; overSince = null; lastAlert = Date.now(); tm.className = ''; loop();
  } catch (e) {
    console.error(e); banner("Le micro n'a pas pu redémarrer. Relance l'écoute."); stopMic();
  } finally { paused = false; }
}
const EMOJI = { idle: '😴', green: '😊', yellow: '😐', orange: '😬', red: '🙉', siren: '🚨' };
function setState(s, title, sub) {
  document.body.dataset.state = s;
  const m = $('mascot'); if (m.dataset.s !== s) { m.dataset.s = s; m.innerHTML = `<span>${EMOJI[s]}</span>`; }
  $('title').textContent = title; $('sub').textContent = sub;
}
function sirenMode(ms) {
  siren = true; clearTimeout(sirenT);
  setState('siren', 'Niveau 5 : sirène !', 'Trop bruyant ! Ça va être long de tout ranger !');
  sirenT = setTimeout(() => { siren = false; if (!listening) idle(); }, ms);
}
function idle() {
  siren = false;
  setState('idle', 'En veille', "Lance l'écoute pour démarrer");
  $('fill').style.width = '0%'; $('pct').textContent = '0%'; $('timer').className = '';
}

function updateSteps() {
  $('lvl-text').textContent = `${level} / 5`;
  for (let i = 1; i <= 5; i++) $('step-' + i).classList.toggle('on', i <= level);
  if (level > shown) { const el = $('step-' + level); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  shown = level;
}

async function lockScreen() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      $('wl').textContent = 'Écran allumé'; $('wl-dot').className = 'dot on';
      wakeLock.addEventListener('release', () => { $('wl').textContent = 'Écran auto'; $('wl-dot').className = 'dot'; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && listening) { lockScreen(); if (ctx) ctx.resume().catch(() => {}); }
});

async function startMic() {
  banner();
  try {
    await ensureAudio(); await lockScreen();
    applySession();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }, video: false });
    applySession();
    analyser = ctx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .25;
    ctx.createMediaStreamSource(micStream).connect(analyser);   // jamais vers la sortie (Larsen)
    if (ctx.state !== 'running') await ctx.resume();
    listening = true; overSince = null; refresh(); loop();
  } catch (e) {
    banner(e.name === 'NotAllowedError' ? "Micro bloqué : Réglages > Safari > Microphone (ou icône « AA » dans la barre d'adresse)." : "Impossible d'accéder au micro. Autorise-le dans Safari.");
    stopMic();
  }
}
function stopMic() {
  listening = false; cancelAnimationFrame(raf); smooth = 0; overSince = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (sessionMode !== 'auto') setSession('playback'); refresh(); if (!siren) idle();
}

function loop() {
  if (!listening || !analyser) return;
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(buf);
  let sum = 0, peak = 0;
  for (const v of buf) { const x = Math.abs((v - 128) / 128); sum += x * x; if (x > peak) peak = x; }
  const raw = Math.min(100, Math.round((Math.sqrt(sum / buf.length) * .7 + peak * .3) * 220 * gainMul));
  smooth = raw > smooth ? Math.round(smooth * .35 + raw * .65) : Math.round(smooth * .7 + raw * .3);
  paint(smooth); escalate(smooth);
  raf = requestAnimationFrame(loop);
}

function escalate(v) {
  const now = Date.now(), tm = $('timer');
  if (lastAlert > 0 && now - lastAlert < cooldownMs) {
    tm.className = 'show'; tm.innerHTML = ico('pause') + `Pause ${Math.ceil((cooldownMs - (now - lastAlert)) / 1000)}s`; overSince = null; return;
  }
  if (v >= threshold) {
    if (!overSince) overSince = now;
    const el = now - overSince;
    if (el >= delayMs) {
      if (level < 5) level++;
      updateSteps(); alarm(level); lastAlert = now; overSince = null; tm.className = '';
    } else { tm.className = 'show'; tm.innerHTML = ico('timer') + `Niveau ${Math.min(5, level + 1)} dans ${((delayMs - el) / 1000).toFixed(1)}s`; }
  } else { overSince = null; tm.className = ''; }
}

function paint(v) {
  $('fill').style.width = v + '%'; $('pct').textContent = v + '%';
  if (siren) return;
  if (v >= threshold) setState('red', 'Trop de bruit !', `Alerte niveau ${level}/5`);
  else if (v >= Math.max(12, threshold * .82)) setState('orange', 'Chuuut !', "Dernier avertissement avant l'alarme");
  else if (v >= Math.max(8, threshold * .62)) setState('yellow', 'Ça chauffe…', 'On baisse un peu le volume');
  else setState('green', 'Tout est zen', level > 0 ? `Bien ! Niveau actuel : ${level}/5` : 'Super ambiance, continuez !');
}

function refresh() {
  const b = $('toggle');
  b.className = 'btn primary' + (listening ? ' stop' : '');
  b.innerHTML = listening ? ico('stop') + "Arrêter l'écoute" : ico('mic') + "Démarrer l'écoute";
  $('mic-dot').className = 'dot' + (listening ? ' live' : '');
  $('mic-text').textContent = listening ? `Écoute active · ${gainMul.toFixed(1)}x` : 'Micro en pause';
}

$('toggle').addEventListener('click', () => listening ? stopMic() : startMic());
$('reset').addEventListener('click', () => { level = 0; siren = false; clearTimeout(sirenT); overSince = null; updateSteps(); if (!listening) idle(); });

const bind = (id, fn) => $(id).addEventListener('input', e => fn(+e.target.value));
bind('s-th', v => { threshold = v; $('v-th').textContent = $('th-text').textContent = v + '%'; $('mark').style.left = v + '%'; });
bind('s-gain', v => { gainMul = v; $('v-gain').textContent = v.toFixed(1) + 'x'; if (listening) refresh(); });
bind('s-delay', v => { delayMs = v * 1000; $('v-delay').textContent = v.toFixed(1) + 's'; });
bind('s-cd', v => { cooldownMs = v * 1000; $('v-cd').textContent = v + 's'; });

// --- Mémorisation des réglages ---
const KEY = 'sonometre-settings', IDS = ['s-th', 's-gain', 's-delay', 's-cd'];
function save() { try { const o = {}; IDS.forEach(i => o[i] = $(i).value); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
try {
  const o = JSON.parse(localStorage.getItem(KEY) || '{}');
  IDS.forEach(i => { if (o[i] != null) { $(i).value = o[i]; $(i).dispatchEvent(new Event('input')); } });
} catch (e) {}
document.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('change', save));

idle(); refresh(); updateSteps();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointiii</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{--bg:#5B2BB5;--ink:#2A1060;--card:#F6EEFF;--coral:#FF7A7A;--peach:#FFDCC8;--mint:#BDEFD8;--sun:#FFE27A;--white:#fff;--line:#D9C8F5;--am:#FFE27A;--pm:#A8D4FF;--ams:#FFF3B8;--pms:#DCEEFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#150B30;--ink:#F3EBFF;--card:#21143F;--peach:#3B2A68;--mint:#1F6B58;--sun:#FFE27A;--white:#2E1E57;--line:#4A3880;--ams:#4D4210;--pms:#163F66}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:16px;line-height:1.25;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff}
header h1{margin:0;font-size:24px;font-weight:800}.logo{font-family:"Caveat Brush","Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-weight:400;font-size:42px;line-height:1;letter-spacing:.5px;color:#FFDCC8;transform:rotate(-3deg);text-shadow:0 3px 0 rgba(20,5,50,.35)}.logo span{display:inline-block;-webkit-text-stroke:1.5px currentColor}.logo .a{color:#FF7A7A;transform:rotate(-6deg)}.logo .b{color:#FFE27A;transform:rotate(4deg) translateY(-2px)}.logo .c{color:#A8D4FF;transform:rotate(-3deg)}.logo .d{color:#FF7A7A;margin-left:.1em;letter-spacing:-.06em;transform:rotate(-10deg) translateY(-2px)}
nav{display:flex;gap:8px;padding:0 12px 10px;max-width:960px;margin:auto}
nav button{flex:1;border:0;border-radius:16px;padding:8px 6px;font-size:16px;font-weight:700;font-family:inherit;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;min-height:44px}
nav button[aria-selected=true]{background:#FFDCC8;color:#2A1060}
main{background:var(--card);border-radius:28px 28px 0 0;padding:16px 14px 40px;min-height:75vh}
.wrap{max-width:960px;margin:auto}
h2{margin:0 0 10px;font-size:22px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select{font-size:16px;font-weight:600;font-family:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--white);color:var(--ink);min-height:44px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.search{flex:1;min-width:180px}
.btn{border:0;border-radius:14px;padding:8px 16px;font-size:16px;font-weight:800;font-family:inherit;background:var(--coral);color:#2A1060;cursor:pointer;min-height:44px}
.btn.alt{background:var(--sun);color:#2A1060}.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:2px 14px;font-size:15px;font-weight:700;font-family:inherit;white-space:nowrap;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card)}
.ch{margin:14px 0 6px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--coral);padding-bottom:2px}
.ch span{font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kid{display:flex;flex-direction:column;background:var(--peach);border-radius:20px;overflow:hidden;color:var(--ink)}
.kid.m{background:var(--am)}.kid.s{background:var(--pm)}.kid.m,.kid.s,.kid.m .main,.kid.s .main{color:#2A1060}
.kid .main{flex:1;border:0;background:transparent;color:var(--ink);font-family:inherit;text-align:left;padding:8px 12px 2px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kid .main b{font-size:16px;font-weight:800;line-height:1.05}.kid .main small{font-size:14px;font-weight:600;line-height:1.05}
.kid .tm{margin:2px 10px 8px;align-self:flex-start;border:2px dashed #2A1060;background:rgba(255,255,255,.55);color:#2A1060;border-radius:999px;padding:1px 12px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;min-height:34px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--white);border-radius:12px;padding:6px 12px;flex-wrap:wrap}
.item b{flex:1;min-width:150px;font-weight:700}
.hint{font-size:14px;opacity:.85;margin:0 0 8px}
b .hint,h3 .hint{margin:0}
.tot{font-weight:800;font-size:20px;margin:10px 0 0}
table{width:100%;border-collapse:collapse;background:var(--white);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--peach);color:var(--ink)}th.cm{background:var(--am);color:#2A1060}th.cs{background:var(--pm);color:#2A1060}td.cm{background:var(--ams)}td.cs{background:var(--pms)}
.scroll{overflow-x:auto}
details.fact{background:var(--white);border-radius:14px;padding:0 12px;margin-bottom:6px}
details.fact summary{cursor:pointer;display:flex;gap:8px;align-items:center;min-height:46px;font-weight:800;list-style:none}
details.fact summary::-webkit-details-marker{display:none}
details.fact summary::before{content:"▸";font-size:14px}
details.fact[open] summary::before{content:"▾"}
details.fact summary .n{flex:1}
.fb{padding:0 0 12px}
.empty{padding:20px;text-align:center;background:var(--white);border-radius:16px}
#ov{position:fixed;inset:0;background:rgba(20,5,50,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov .box{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:340px}
.btn.m{background:var(--am);color:#2A1060}.btn.s{background:var(--pm);color:#2A1060}.bar{position:relative;display:flex;justify-content:space-between;align-items:center;overflow:hidden;border-radius:12px;padding:8px 12px 10px;font-weight:800;margin:0 0 8px;color:#2A1060}.bar i{position:absolute;left:0;bottom:0;height:4px;background:#2A1060;border-radius:0 4px 4px 0}.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);margin:0 -14px 4px;padding:6px 14px 0;box-shadow:0 8px 8px -8px rgba(0,0,0,.35)}.kid,.btn,.chip,nav button{transition:transform .15s ease,background-color .25s ease,box-shadow .2s ease}.kid:active,.btn:active,.chip:active,nav button:active{transform:scale(.95)}@media (hover:hover){.kid:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}#app.enter .kid,#app.enter .item,#app.enter details.fact,#app.enter .ch{animation:in .32s ease backwards}details.fact[open] .fb{animation:in .25s ease backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.bar.m{background:var(--am)}.bar.s{background:var(--pm)}#ov .box{max-width:420px;max-height:90vh;overflow:auto}#ov .box input,#ov .box select{width:100%}#ov .box input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:#FF7A7A;flex:none}.lock{max-width:340px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:stretch}.lock input{text-align:center;font-size:24px;letter-spacing:.4em}.lockic{font-size:44px}.err{margin:0;min-height:1.3em;font-weight:700;color:#B3122B}@media (prefers-color-scheme:dark){.err{color:#FF9AA8}}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#FFDCC8;color:#2A1060;padding:8px 16px;border-radius:14px;display:none;font-weight:700;z-index:30}
@media print{body{background:#fff}header,nav,.noprint,#toast,#ov{display:none!important}main{background:#fff;padding:0;border-radius:0}details.fact{border:1px solid #999;border-radius:0;break-after:page;padding:8px}details.fact summary::before{content:""}body.one details.fact:not(.sel){display:none}:root{--ink:#000;--white:#fff}th{background:#eee}}
</style>
</head>
<body>
<header><h1 class="logo" aria-label="Pointiii"><span>Point</span><span class="a">i</span><span class="b">i</span><span class="c">i</span></h1></header>
<nav role="tablist" id="nav"><button data-t="pointage">Pointage</button><button data-t="enfants">🔒 Enfants</button><button data-t="facture">🔒 Factures</button></nav>
<main><div class="wrap" id="app"></div></main>
<div id="ov"><div class="box" id="ovb"></div></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={kids:[],rec:{}};
try{const r=localStorage.getItem('garderie');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('garderie',JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const mins=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const r2=n=>Math.round(n*100)/100;
/* Une heure pile tombe dans la tranche la plus chère */
const prixMatin=h=>{const t=mins(h);return t>510?0:t>480?.9:t>450?1.8:2.7};
const prixSoir=h=>{const t=mins(h);return t<1000?0:t<1030?.9:t<1060?1.8:t<1090?2.7:t<1120?3.9:5.1};
let tab='pointage',mode=new Date().getHours()<12?'m':'s',date=today(),month=today().slice(0,7),editKid=null,cls='',q='',long=false,timer=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';anim(t,[{opacity:0,transform:'translate(-50%,12px)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:200});clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',1800)};
const cn=k=>k.classe||'Sans classe';
const CL=['TPS','PS','MS','GS','CP','CE1','CE2','CM1','CM2'];const ord=c=>{const i=CL.indexOf(c);return i<0?99:i};const classes=()=>[...new Set(S.kids.map(cn))].sort((a,b)=>ord(a)-ord(b));
const filt=()=>{const w=q.trim().toLowerCase();return S.kids.filter(k=>(!cls||cn(k)===cls)&&(!w||(k.prenom+' '+k.nom+' '+cn(k)+' '+(k.famille||'')).toLowerCase().includes(w)))};
const byName=(a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom,'fr');
const chips=()=>S.kids.length?`<div class="chips noprint"><button class="chip" data-cls="" aria-pressed="${!cls}">Toutes</button>${classes().map(c=>`<button class="chip" data-cls="${esc(c)}" aria-pressed="${cls===c}">${esc(c)}</button>`).join('')}</div>`:'';
const searchBox=ph=>`<div class="row noprint"><input class="search" id="q" type="search" placeholder="${ph}" value="${esc(q)}" aria-label="Rechercher"></div>`;

const anim=(el,k,o)=>{if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;el.animate(k,o)};
const showOv=()=>{$('#ov').style.display='flex';anim($('#ov'),[{opacity:0},{opacity:1}],{duration:150});anim($('#ovb'),[{opacity:0,transform:'translateY(14px) scale(.94)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'})};
const barHtml=()=>{const day=S.rec[date]||{},ks=filt();const n=ks.filter(k=>(day[k.id]||{})[mode]).length;const pct=ks.length?Math.round(n/ks.length*100):0;return `<div class="bar ${mode}"><span>${mode==='m'?'☀️ Matin · arrivées':'🌙 Soir · départs'}</span><span><b>${n}</b> enfant${n>1?'s':''} présent${n>1?'s':''}</span></div>`};
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
 $('#app').innerHTML=(tab!=='pointage'&&!unlocked)?vLock():tab==='pointage'?vPointage():tab==='enfants'?vEnfants():vFacture();const a=$('#app');if(tab!=='pointage'&&unlocked)a.insertAdjacentHTML('afterbegin','<div class="row noprint" style="justify-content:flex-end"><button class="btn ghost sm" data-chpin="1">Changer le code</button><button class="btn alt sm" data-lock="1">🔒 Verrouiller</button></div>');a.classList.add('enter');clearTimeout(render.t);render.t=setTimeout(()=>a.classList.remove('enter'),600);
}
const lists={pointage:()=>barHtml()+lPointage(),enfants:()=>lEnfants(),facture:()=>lFacture()};
const relist=()=>{const l=$('#list');if(l)l.innerHTML=lists[tab]()};

function vPointage(){
 return `<h2>Pointage</h2><div class="sticky"><div class="row noprint"><input type="date" id="date" value="${date}" aria-label="Date"><button class="btn ${mode==='m'?'m':'ghost'}" data-mode="m">☀️ Matin</button><button class="btn ${mode==='s'?'s':'ghost'}" data-mode="s">🌙 Soir</button></div>${searchBox('Rechercher un enfant, une classe…')}${chips()}</div><p class="hint">Touche un enfant pour le pointer. Touche son heure (ou reste appuyé sur lui) pour la modifier.</p><div id="list">${barHtml()+lPointage()}</div>`;
}
function lPointage(){
 const day=S.rec[date]||{},ks=filt();
 if(!S.kids.length)return `<div class="empty">Aucun enfant pour l’instant. Ajoute-les dans l’onglet Enfants.</div>`;
 if(!ks.length)return `<div class="empty">Aucun enfant trouvé.</div>`;
 let h='';
 for(const c of classes()){
  const g=ks.filter(k=>cn(k)===c).sort(byName);if(!g.length)continue;
  const n=g.filter(k=>(day[k.id]||{})[mode]).length;
  h+=`<div class="ch">${esc(c)}<span>${n} présent${n>1?'s':''}</span></div><div class="grid">`+g.map(k=>{
   const t=(day[k.id]||{})[mode],p=t?(mode==='m'?prixMatin(t):prixSoir(t)):0;
   return `<div class="kid ${t?mode:''}"><button class="main" data-pt="${k.id}"><b>${esc(k.prenom)}</b><small>${esc(k.nom)}</small></button>${t?`<button class="tm" data-edt="${k.id}" aria-label="Modifier l’heure de ${esc(k.prenom)}">${t}</button>`:`<small style="margin:0 12px 8px;font-weight:600">À pointer</small>`}</div>`}).join('')+'</div>';
 }
 return h;
}
function vEnfants(){return `<div class="row"><h2 style="flex:1;margin:0">Enfants (${S.kids.length})</h2><button class="btn" data-addkid="1">+ Enfant</button></div>${searchBox('Rechercher un enfant, une classe, une famille…')}${chips()}<div id="list">${lEnfants()}</div>`}
function openKid(id){editKid=id||null;$('#ovb').innerHTML=kidForm();showOv();$('#fp').focus()}
function kidForm(){
 const e=S.kids.find(k=>k.id===editKid)||{prenom:'',nom:'',classe:'',famille:''};
 const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
 return `<h2>${editKid?'Modifier l’enfant':'Ajouter un enfant'}</h2><div class="row"><input id="fp" placeholder="Prénom" value="${esc(e.prenom)}"><input id="fn" placeholder="Nom" value="${esc(e.nom)}"><select id="fc"><option value="">Classe…</option>${CL.map(c=>`<option${e.classe===c?' selected':''}>${c}</option>`).join('')}</select><input id="ff" placeholder="Famille (pour la facture)" value="${esc(e.famille)}" list="fams">${dl('fams',[...new Set(S.kids.map(k=>k.famille).filter(Boolean))])}<button class="btn" data-sk="1">${editKid?'Enregistrer':'Ajouter'}</button><button class="btn ghost" data-cancel="1">Annuler</button></div>`;
}
function lEnfants(){
 if(!S.kids.length)return `<div class="empty">Aucun enfant. Remplis le formulaire ci-dessus.</div>`;
 const ks=filt();if(!ks.length)return `<div class="empty">Aucun enfant trouvé.</div>`;
 let h='';
 for(const c of classes()){
  const g=ks.filter(k=>cn(k)===c).sort(byName);if(!g.length)continue;
  h+=`<div class="ch">${esc(c)}<span>${g.length} enfant${g.length>1?'s':''}</span></div><div class="list">`+g.map(k=>`<div class="item"><b>${esc(k.prenom)} ${esc(k.nom)} <span class="hint">· ${esc(k.famille||'sans famille')}</span></b><button class="btn alt sm" data-ed="${k.id}">Modifier</button><button class="btn ghost sm" data-del="${k.id}">Supprimer</button></div>`).join('')+'</div>';
 }
 return h;
}
function calc(kid){
 const lines=[];let tot=0;
 for(const d of Object.keys(S.rec).filter(d=>d.startsWith(month)).sort()){
  const r=S.rec[d][kid.id];if(!r)continue;
  const m=r.m?prixMatin(r.m):0,s=r.s?prixSoir(r.s):0;
  if(m||s){lines.push({d,mt:r.m,m,st:r.s,s});tot+=m+s}
 }
 return{lines,tot:r2(tot)};
}
const fd=d=>d.split('-').reverse().join('/');
function vFacture(){
 return `<h2 class="noprint">Factures</h2><div class="row noprint"><input type="month" id="month" value="${month}" aria-label="Mois"><button class="btn" data-print="all">Tout en PDF</button><button class="btn ghost" data-reset="1">Réinitialiser…</button></div>${searchBox('Rechercher une famille, un enfant…')}${chips()}<p class="hint noprint">Touche une famille pour voir sa facture, puis télécharge-la en PDF.</p><div id="list">${lFacture()}</div>`;
}
function lFacture(){
 const fams={};filt().forEach(k=>{const f=k.famille||'Sans famille';(fams[f]=fams[f]||[]).push(k)});
 const names=Object.keys(fams).sort((a,b)=>a.localeCompare(b,'fr'));
 if(!S.kids.length)return `<div class="empty">Ajoute des enfants et pointe-les pour générer une facture.</div>`;
 if(!names.length)return `<div class="empty">Aucune famille trouvée.</div>`;
 const mois=new Date(month+'-01T12:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 const open=names.length===1&&q?' open':'';
 return names.map((f,i)=>{
  let total=0,body='';
  for(const k of fams[f]){
   const c=calc(k);total+=c.tot;
   body+=`<h3 style="margin:10px 0 4px;font-size:17px">${esc(k.prenom)} ${esc(k.nom)} <span class="hint">· ${esc(cn(k))}</span></h3>`+(c.lines.length?`<div class="scroll"><table><tr><th>Jour</th><th class="cm">☀️ Matin</th><th class="cs">🌙 Soir</th><th>Total</th></tr>${c.lines.map(l=>`<tr><td>${fd(l.d)}</td><td class="cm">${l.m?`${l.mt} · ${eur(l.m)}`:'—'}</td><td class="cs">${l.s?`${l.st} · ${eur(l.s)}`:'—'}</td><td>${eur(r2(l.m+l.s))}</td></tr>`).join('')}<tr><th colspan="3">Sous-total</th><th>${eur(c.tot)}</th></tr></table></div>`:`<p class="hint">Aucune garderie facturée ce mois-ci.</p>`);
  }
  return `<details class="fact" data-fam="${esc(f)}"${open}><summary><span class="n">${esc(f)} <span class="hint">· ${fams[f].length} enfant${fams[f].length>1?'s':''}</span></span><span>${eur(r2(total))}</span></summary><div class="fb"><h2>Garderie périscolaire · ${mois}</h2><div>Famille ${esc(f)}</div>${body}<p class="tot">À payer : ${eur(r2(total))}</p><div class="noprint" style="margin-top:8px"><button class="btn alt sm" data-print="1">Télécharger le PDF</button></div></div></details>`;
 }).join('');
}
async function pdfFactures(only){
 const dl=typeof claude!=='undefined'?await claude.use('downloads'):{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};if(!dl){toast('Téléchargement indisponible ici');return}
 if(!window.jspdf){toast('PDF indisponible (connexion ?)');return}
 const fams={};filt().forEach(k=>{const n=k.famille||'Sans famille';(fams[n]=fams[n]||[]).push(k)});
 let names=Object.keys(fams).sort((a,b)=>a.localeCompare(b,'fr'));if(only)names=names.filter(n=>n===only);
 if(!names.length){toast('Rien à exporter');return}
 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
 const mois=new Date(month+'-01T12:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 const X=[15,50,100,150],W=[35,50,50,45],HD=['Jour','Matin','Soir','Total'];
 const HC=[[255,220,200],[255,226,122],[168,212,255],[255,220,200]],BC=[[255,255,255],[255,243,184],[220,238,255],[255,255,255]];
 const sun=(x,y)=>{doc.setFillColor(255,170,0);doc.setDrawColor(255,170,0);doc.setLineWidth(.35);doc.circle(x,y,1.3,'F');for(let a=0;a<8;a++){const r=a*Math.PI/4;doc.line(x+Math.cos(r)*2,y+Math.sin(r)*2,x+Math.cos(r)*2.8,y+Math.sin(r)*2.8)}};
 const moon=(x,y)=>{doc.setFillColor(60,100,190);doc.circle(x,y,2,'F');doc.setFillColor(...HC[2]);doc.circle(x+1.1,y-0.7,1.8,'F')};
 const row=(y,c,kind)=>{
  if(kind===1){doc.setFillColor(...HC[0]);doc.roundedRect(15,y,180,7,2.5,2.5,'F');doc.rect(15,y+3.5,180,3.5,'F');doc.setFillColor(...HC[1]);doc.rect(X[1],y,W[1],7,'F');doc.setFillColor(...HC[2]);doc.rect(X[2],y,W[2],7,'F')}
  else if(kind===2){doc.setFillColor(...HC[0]);doc.roundedRect(15,y,180,7,2.5,2.5,'F');doc.rect(15,y,180,3.5,'F')}
  else{[1,2].forEach(j=>{doc.setFillColor(...BC[j]);doc.rect(X[j],y,W[j],7,'F')});doc.setDrawColor(217,200,245);doc.setLineWidth(.2);doc.line(15,y+7,195,y+7)}
  doc.setTextColor(42,16,96);
  c.forEach((t,j)=>doc.text(String(t),X[j]+2+(kind===1&&(j===1||j===2)?7:0),y+4.9));
  if(kind===1){sun(X[1]+5,y+3.5);moon(X[2]+5,y+3.5)}
 };
 names.forEach((f,i)=>{
  if(i)doc.addPage();
  let y=20,total=0;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(91,43,181);doc.text('Garderie périscolaire',15,y);y+=8;
  doc.setFontSize(12);doc.setTextColor(42,16,96);doc.text(mois.charAt(0).toUpperCase()+mois.slice(1)+' · Famille '+f,15,y);y+=10;
  for(const k of fams[f]){
   const c=calc(k);total+=c.tot;
   if(y+30>282){doc.addPage();y=20}
   doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(42,16,96);doc.text(k.prenom+' '+k.nom+' ('+cn(k)+')',15,y);y+=4;
   doc.setFontSize(10);
   if(!c.lines.length){doc.setFont('helvetica','normal');doc.text('Aucune garderie facturée ce mois-ci.',15,y+4);y+=11;continue}
   doc.setFont('helvetica','bold');row(y,HD,1);y+=7;doc.setFont('helvetica','normal');
   for(const l of c.lines){
    if(y+7>282){doc.addPage();y=20;doc.setFont('helvetica','bold');row(y,HD,1);y+=7;doc.setFont('helvetica','normal')}
    row(y,[fd(l.d),l.m?l.mt+' · '+eur(l.m):'-',l.s?l.st+' · '+eur(l.s):'-',eur(r2(l.m+l.s))]);y+=7;
   }
   if(y+7>282){doc.addPage();y=20}
   doc.setFont('helvetica','bold');row(y,['Sous-total','','',eur(c.tot)],2);y+=12;
  }
  if(y+12>282){doc.addPage();y=20}
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(42,16,96);doc.text('À payer : '+eur(r2(total)),15,y+4);
 });
 await dl.save({filename:'factures-'+month+(only?'-'+only.replace(/[^\w-]+/g,'_'):'')+'.pdf',data:doc.output('arraybuffer')});return true;
}
let unlocked=false,lastAct=Date.now();
const getPin=()=>{try{return localStorage.getItem('garderie_pin')}catch(e){return null}};
const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nudge:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(s)}};
function vLock(){const has=!!getPin();const f=(id,p)=>`<input id="${id}" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="${p}" aria-label="${p}">`;return `<div class="lock"><div class="lockic">🔒</div><h2>Espace direction</h2><p class="hint">${has?'Saisis le code PIN pour accéder à cette page.':'Première utilisation : crée un code PIN (4 à 6 chiffres) pour protéger les enfants et les factures.'}</p>${f('pin','Code PIN')}${has?'':f('pin2','Confirme le code')}<p class="err" id="perr" role="alert"></p><button class="btn" data-unlock="1">${has?'Déverrouiller':'Créer le code'}</button></div>`}
async function doUnlock(){
 const err=m=>{$('#perr').textContent=m;anim($('.lock'),[{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:260})};
 const p=$('#pin').value.trim();
 if(!/^\d{4,6}$/.test(p)){err('Le code doit faire 4 à 6 chiffres.');return}
 const st=getPin();
 if(!st){if($('#pin2').value.trim()!==p){err('Les deux codes sont différents.');return}
  try{localStorage.setItem('garderie_pin',await sha(p))}catch(e){err('Impossible d’enregistrer le code.');return}
  unlocked=true;lastAct=Date.now();toast('Code créé');render();return}
 if(await sha(p)===st){unlocked=true;lastAct=Date.now();render()}else{err('Code incorrect.');$('#pin').value=''}
}
function openPin(){$('#ovb').innerHTML=`<h2>Changer le code</h2><div class="row"><input id="np1" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="Nouveau code (4 à 6 chiffres)"><input id="np2" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="Confirme le code"></div><p class="err" id="nperr" role="alert"></p><div class="row"><button class="btn" data-savepin="1">Enregistrer</button><button class="btn ghost" data-mclose="1">Annuler</button></div>`;showOv();$('#np1').focus()}
async function savePin(){
 const a=$('#np1').value.trim(),b=$('#np2').value.trim(),e=$('#nperr');
 if(!/^\d{4,6}$/.test(a)){e.textContent='Le code doit faire 4 à 6 chiffres.';return}
 if(a!==b){e.textContent='Les deux codes sont différents.';return}
 try{localStorage.setItem('garderie_pin',await sha(a));closeEdit();toast('Code modifié')}catch(x){e.textContent='Impossible d’enregistrer le code.'}
}
const monthsData=()=>{const m={};for(const d in S.rec){if(Object.values(S.rec[d]).some(x=>x.m||x.s)){const k=d.slice(0,7);m[k]=(m[k]||0)+1}}return Object.entries(m).sort()};
const monthLabel=m=>new Date(m+'-01T12:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
function openReset(){
 const ms=monthsData();
 $('#ovb').innerHTML=ms.length?`<h2>Réinitialiser des mois</h2><p class="hint">Coche les mois à clôturer. Chacun est d’abord exporté en PDF (un fichier par mois), puis ses pointages sont supprimés de cet appareil. Les enfants sont conservés.</p><div class="list">${ms.map(([m,n])=>`<label class="item"><input type="checkbox" name="rm" value="${m}"><b>${monthLabel(m)}</b><span class="hint">${n} jour${n>1?'s':''}</span></label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" data-doreset="1">Exporter et réinitialiser</button><button class="btn alt sm" data-allm="1">Tout cocher</button><button class="btn ghost" data-mclose="1">Annuler</button></div>`:`<h2>Réinitialiser des mois</h2><p class="hint">Aucun pointage à réinitialiser pour l’instant.</p><div class="row"><button class="btn ghost" data-mclose="1">Fermer</button></div>`;
 showOv();
}
async function exportMonth(m){const sm=month,sq=q,sc=cls;month=m;q='';cls='';try{return await pdfFactures(null)}finally{month=sm;q=sq;cls=sc}}
async function doReset(){
 const ms=[...document.querySelectorAll('#ovb input[name=rm]:checked')].map(i=>i.value);
 if(!ms.length){toast('Choisis au moins un mois');return}
 const done=[];
 for(const m of ms){try{if(!(await exportMonth(m)))break;done.push(m)}catch(e){break}}
 done.forEach(m=>{for(const d of Object.keys(S.rec))if(d.startsWith(m))delete S.rec[d]});
 save();closeEdit();render();
 toast(done.length?done.length+' mois exporté'+(done.length>1?'s':'')+' et réinitialisé'+(done.length>1?'s':''):'Rien n’a été supprimé');
}
function openEdit(id){
 const k=S.kids.find(x=>x.id===id),t=((S.rec[date]||{})[id]||{})[mode]||'';
 $('#ovb').innerHTML=`<h2>${esc(k.prenom)} ${esc(k.nom)}</h2><p class="hint">${mode==='m'?'Arrivée':'Départ'} le ${fd(date)}</p><div class="row"><input type="time" id="mt" value="${t}" aria-label="Heure"></div><div class="row"><button class="btn" data-msave="${id}">Enregistrer</button>${t?`<button class="btn ghost" data-mdel="${id}">Effacer l’heure</button>`:''}<button class="btn ghost" data-mclose="1">Annuler</button></div>`;
 showOv();$('#mt').focus();
}
const closeEdit=()=>{$('#ov').style.display='none'};
const setT=(id,t)=>{const day=S.rec[date]=S.rec[date]||{};const r=day[id]=day[id]||{};if(t)r[mode]=t;else delete r[mode];save()};

document.addEventListener('click',e=>{
 lastAct=Date.now();const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t!==undefined){tab=d.t;q='';cls='';if(tab==='pointage')unlocked=false;render()}
 else if(d.cls!==undefined){cls=d.cls;render()}
 else if(d.mode){mode=d.mode;render()}
 else if(d.pt){if(long){long=false;return}const t=(S.rec[date]||{})[d.pt];if(t&&t[mode]){setT(d.pt,'');toast('Pointage annulé')}else{setT(d.pt,nowHM());toast('Pointé à '+nowHM())}relist();const el=document.querySelector('[data-pt="'+d.pt+'"]');if(el)anim(el.parentElement,[{transform:'scale(.9)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'})}
 else if(d.edt)openEdit(d.edt)
 else if(d.msave){const t=$('#mt').value;if(!t){toast('Choisis une heure');return}setT(d.msave,t);closeEdit();toast('Heure enregistrée');relist()}
 else if(d.mdel){setT(d.mdel,'');closeEdit();relist()}
 else if(d.mclose)closeEdit()
 else if(d.unlock)doUnlock()
 else if(d.lock){unlocked=false;render()}
 else if(d.chpin)openPin()
 else if(d.savepin)savePin()
 else if(d.reset)openReset()
 else if(d.doreset)doReset()
 else if(d.allm)document.querySelectorAll('#ovb input[name=rm]').forEach(i=>i.checked=true)
 else if(d.sk){const p=$('#fp').value.trim(),n=$('#fn').value.trim(),c=$('#fc').value.trim(),f=$('#ff').value.trim();if(!p||!n){toast('Prénom et nom requis');return}
  if(editKid){Object.assign(S.kids.find(k=>k.id===editKid),{prenom:p,nom:n,classe:c,famille:f});editKid=null}else S.kids.push({id:'k'+Date.now(),prenom:p,nom:n,classe:c,famille:f});save();closeEdit();toast('Enregistré');render()}
 else if(d.ed)openKid(d.ed)
 else if(d.addkid)openKid()
 else if(d.cancel){editKid=null;closeEdit()}
 else if(d.del){const k=S.kids.find(k=>k.id===d.del);if(confirm('Supprimer '+k.prenom+' '+k.nom+' et ses pointages ?')){S.kids=S.kids.filter(x=>x.id!==k.id);Object.values(S.rec).forEach(r=>delete r[k.id]);save();render()}}
 else if(d.print){pdfFactures(d.print==='all'?null:b.closest('details').dataset.fam).catch(x=>{if(!x||x.code!=='declined')toast('PDF impossible')})}
});
window.addEventListener('beforeprint',()=>document.querySelectorAll('details.fact').forEach(x=>{x.dataset.was=x.open?1:0;x.open=true}));
window.addEventListener('afterprint',()=>document.querySelectorAll('details.fact').forEach(x=>{x.open=x.dataset.was==='1'}));
document.addEventListener('input',e=>{lastAct=Date.now();if(e.target.id==='q'){q=e.target.value;relist()}});
document.addEventListener('change',e=>{
 if(e.target.id==='date'&&e.target.value){date=e.target.value;render()}
 if(e.target.id==='month'&&e.target.value){month=e.target.value;render()}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.main[data-pt]');if(!b)return;long=false;timer=setTimeout(()=>{long=true;openEdit(b.dataset.pt)},550)});
['pointerup','pointerleave','pointercancel','scroll'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(timer),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.main[data-pt]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit();if(e.key==='Enter'&&(e.target.id==='pin'||e.target.id==='pin2'))doUnlock()});
setInterval(()=>{if(unlocked&&tab!=='pointage'&&Date.now()-lastAct>300000){unlocked=false;closeEdit();render()}},15000);
render();
</script>
</body>
